# Despliegue en Oracle Cloud / VPS.
# Uso: docker compose -f docker-compose.cloud.yml --env-file .env.cloud up -d --build
#
# - Oracle NO se publica a internet (solo red interna Docker)
# - La app escucha en 8081; delante conviene Caddy/Nginx o Cloudflare Tunnel (HTTPS)

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    platform: linux/amd64
    container_name: oracle-control-gastos
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: controlgastos
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD}
    volumes:
      - oracle-control-gastos-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 180s
    mem_limit: 2500m
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: control-gastos-api
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: controlgastos
      SPRING_DATASOURCE_PASSWORD: ${ORACLE_APP_PASSWORD}
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      JAVA_OPTS: "-Xms256m -Xmx512m -Dfile.encoding=UTF-8"
      LOGGING_LEVEL_COM_CONTROLGASTOS: INFO
    depends_on:
      oracle:
        condition: service_healthy
    mem_limit: 768m
    restart: unless-stopped

volumes:
  oracle-control-gastos-data:
    name: oracle-control-gastos-data
