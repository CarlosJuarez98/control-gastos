spring.application.name=control-gastos
# Fijo — no cambiar ni dejar que Angular/Spring abran otro puerto.
# Control gastos: front 4201 / API 8081 / Oracle 1522
server.port=8081

# Oracle propio de este proyecto (Docker: oracle-control-gastos, puerto host 1522)
spring.datasource.url=jdbc:oracle:thin:@localhost:1522/XEPDB1
spring.datasource.username=controlgastos
spring.datasource.password=ControlGastos2026
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.root=INFO
logging.level.com.controlgastos=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Fuente de verdad: Oracle. No se importa Excel/seed al arrancar.

# Semilla solo si CG_USUARIO está vacía. Debe coincidir con el login real (Carlos = dueño de los datos).
# Se puede sobreescribir con APP_AUTH_USERNAME / APP_AUTH_PASSWORD.
app.auth.username=Carlos
app.auth.password=CaAnJuRo2798@
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:4201,http://localhost:4201,http://127.0.0.1:8081,http://localhost:8081}

# Retención: borra historial > N años (ingresos, gastos, movimientos, cortes viejos).
# No toca usuarios, cuentas, mensuales ni denominaciones. Conserva el último corte por usuario.
app.retencion.enabled=true
app.retencion.anos=1
app.retencion.cron=0 30 3 * * *

# Sesión HTTP: 20 min de inactividad; cookie para sobreviver recargas (pull-to-refresh).
server.servlet.session.timeout=20m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=CGSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# En HTTPS poner SERVER_SERVLET_SESSION_COOKIE_SECURE=true (por defecto false = HTTP).
server.servlet.session.cookie.secure=${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.path=/
server.forward-headers-strategy=framework
