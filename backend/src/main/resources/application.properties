spring.application.name=control-gastos
server.port=8081

# Oracle propio de este proyecto (Docker: oracle-control-gastos, puerto host 1522)
spring.datasource.url=jdbc:oracle:thin:@localhost:1522/XEPDB1
spring.datasource.username=controlgastos
spring.datasource.password=ControlGastos2026
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.root=INFO
logging.level.com.controlgastos=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

controlgastos.seed.enabled=true
