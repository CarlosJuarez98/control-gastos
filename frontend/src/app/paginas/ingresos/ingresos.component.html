<section class="cab">
  <div>
    <h1>Ingresos</h1>
    <p>{{ filtrados.length }} registros · total {{ total | currency:'MXN':'symbol-narrow':'1.2-2' }}</p>
  </div>
  <input class="buscar" [(ngModel)]="filtro" placeholder="Filtrar por concepto…" />
</section>

@if (error) { <p class="error">{{ error }}</p> }

<form class="alta" (ngSubmit)="guardar()">
  <label>Fecha <input type="date" [(ngModel)]="form.fecha" name="fecha" required /></label>
  <label>Concepto <input [(ngModel)]="form.concepto" name="concepto" required placeholder="Salario, Guardadito…" /></label>
  <label>Monto <input type="number" step="0.01" [(ngModel)]="form.monto" name="monto" required /></label>
  <button type="submit">Agregar ingreso</button>
</form>

<div class="tabla-wrap">
  <table>
    <thead>
      <tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th></th></tr>
    </thead>
    <tbody>
      @for (i of filtrados; track i.id) {
        <tr>
          <td>{{ i.fecha | date:'dd/MM/yyyy' }}</td>
          <td>{{ i.concepto }}</td>
          <td class="mono pos">{{ i.monto | currency:'MXN':'symbol-narrow':'1.2-2' }}</td>
          <td><button type="button" class="peligro" (click)="eliminar(i.id)">Borrar</button></td>
        </tr>
      }
    </tbody>
  </table>
</div>
