<section class="cab">
  <div>
    <h1>Gastos mensuales fijos</h1>
    <p>Compromisos recurrentes · {{ total | currency:'MXN':'symbol-narrow':'1.2-2' }} / mes</p>
  </div>
</section>

@if (error) { <p class="error">{{ error }}</p> }

<form class="alta" (ngSubmit)="guardar()">
  <label>Motivo <input [(ngModel)]="form.motivo" name="motivo" required placeholder="Renta, TDC…" /></label>
  <label>Monto
    <div class="monto-wrap">
      <span class="simbolo">$</span>
      <input
        type="text"
        inputmode="decimal"
        autocomplete="off"
        [(ngModel)]="form.monto"
        name="monto"
        required
        placeholder="0.00"
        (ngModelChange)="alEscribirMonto($event)"
        (keydown)="soloMonto($event)"
      />
    </div>
  </label>
  <button type="submit">Agregar</button>
</form>

<ul class="lista">
  @for (g of items; track g.id) {
    <li>
      <div>
        <strong>{{ g.motivo }}</strong>
        <span class="mono">{{ g.monto | currency:'MXN':'symbol-narrow':'1.2-2' }}</span>
      </div>
      <button type="button" class="peligro" (click)="eliminar(g.id)">Quitar</button>
    </li>
  }
</ul>
