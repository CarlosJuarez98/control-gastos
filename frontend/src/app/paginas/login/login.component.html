<section class="login" aria-label="Inicio de sesión">
  <div class="ambiente" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <span class="peso p1">$</span>
    <span class="peso p2">$</span>
    <span class="peso p3">$</span>
    <span class="peso p4">$</span>
    <span class="peso p5">$</span>
  </div>

  <div class="escena">
    <div class="hero">
      <p class="marca">Control de gastos</p>
    </div>

    <div class="card">
      <h1>Entrar</h1>
      <form enterAvance data-enter-last="go" (ngSubmit)="entrar()">
        <label>
          Usuario
          <input
            name="usuario"
            [(ngModel)]="usuario"
            autocomplete="username"
            enterkeyhint="next"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            required
            #usuarioInput
          />
        </label>
        <label>
          Contraseña
          <div class="campo-clave">
            <input
              name="password"
              [type]="verClave ? 'text' : 'password'"
              [(ngModel)]="password"
              autocomplete="current-password"
              enterkeyhint="go"
              data-no-clear="1"
              required
            />
            <button
              type="button"
              class="ver-clave"
              (click)="verClave = !verClave"
              [attr.aria-pressed]="verClave"
              [attr.aria-label]="verClave ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              {{ verClave ? 'Ocultar' : 'Ver' }}
            </button>
          </div>
        </label>
        <label class="check recordar">
          <input type="checkbox" [(ngModel)]="recordar" name="recordar" />
          <span class="recordar-txt">
            <strong>Recordarme 7 días</strong>
            <small>Mantener sesión aunque cierres la app o el navegador (si no la usas 7 días, pide login otra vez)</small>
          </span>
        </label>
        @if (error) {
          <p class="error" role="alert">{{ error }}</p>
        }
        <button type="submit" class="cta" [disabled]="cargando || !puedeEntrar">
          {{ cargando ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>
    </div>
  </div>
</section>
