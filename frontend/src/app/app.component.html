<div class="shell">
  <header class="top">
    <div class="brand">
      <p class="brand-mark">Control de gastos</p>
    </div>
    <nav>
      @for (l of links; track l.path) {
        <a [routerLink]="l.path" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: l.exact }">{{ l.label }}</a>
      }
    </nav>
  </header>
  <main>
    <router-outlet />
  </main>
</div>
<app-confirm-dialog />
