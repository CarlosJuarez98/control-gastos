# HTTPS público (Let's Encrypt gratis) delante de la API.
# Hostname sslip.io → resuelve a la IP pública sin crear cuenta.
# Uso: docker compose -f docker-compose.cloud-atp.yml --env-file .env.cloud up -d --build
#
# Abre en OCI Security List / NSG: TCP 80 y 443 (además de 22).
# URL: https://163.192.146.143.sslip.io/

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: control-gastos-api
    expose:
      - "8081"
    ports:
      - "8081:8081"
    env_file:
      - .env.cloud
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: oracle.jdbc.OracleDriver
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:-true}
      JAVA_OPTS: "-Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Doracle.net.tns_admin=/wallet"
      LOGGING_LEVEL_COM_CONTROLGASTOS: INFO
    volumes:
      - ./wallet:/wallet:ro
    mem_limit: 768m
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: control-gastos-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
